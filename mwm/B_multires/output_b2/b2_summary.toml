# b2 multi-resolution error CORRECTION test -- summary
stage = "b2"
trunc_hi = 85
trunc_lo = 31
nlev = 8
spinup_days = 200
mean_days = 360
sigma_level = 0.4375
approx_pressure_hPa = 437.5
nsteps_hi = 34560
nsteps_bare = 12960
nsteps_corr = 12960
common_grid = "FullGaussianGrid nlat_half=24 (96x48)"
radius_m = 6.371e6

# ------------------------------------------------------------------
# HEADLINE: does ΔF move T31 toward T85? (fractional RMS error reduction)
# frac_reduction = (RMS(bare-target) - RMS(corr-target)) / RMS(bare-target)
# 1.0 = perfect reproduction, 0.0 = no effect, <0 = made worse
# ------------------------------------------------------------------
[error_reduction.Zstar]  # ~438.0hPa geop. height, metres
rms_bare_minus_target = 27.834
rms_corr_minus_target = 22.413
frac_reduction        = 0.1948
frac_reduction_NH     = 0.1438

[error_reduction.Tstar]  # kelvin
rms_bare_minus_target = 0.9352
rms_corr_minus_target = 1.2373
frac_reduction        = -0.323

[error_reduction.Ustar]  # m/s
rms_bare_minus_target = 2.1676
rms_corr_minus_target = 2.3788
frac_reduction        = -0.0974

# ------------------------------------------------------------------
# INJECTION VERIFICATION: forced dynamical-core tendency at X85 should
# be ~0 (residual_frac = max|forced| / max|baseline|). vor/div/pres are
# injected in spectral space; temp/humid in grid space (see b_common.jl).
# ------------------------------------------------------------------
[injection_check.vor]
max_baseline  = 2348.206
max_forced    = 0.0
residual_frac = 0.0
[injection_check.div]

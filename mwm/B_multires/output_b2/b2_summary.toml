ratio_mean_over_rms    = 0.0035
[conservation.humid]
global_mean_phys_per_s = -1.4535362453345667e-11
rms_phys_per_s         = 2.1809993862147853e-9
ratio_mean_over_rms    = 0.0067
[conservation.pres]

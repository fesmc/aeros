# CAVEATS (see README Stage b2):
# - single-tendency-at-mean-state neglects transient rectification
#   (instantaneous RHS at time-mean state != time-mean RHS); leading
#   candidate if reproduction is partial. The iterated / mean-tendency
#   version would be the next step.
# - full-field correction (not §3.7's 'selected terms' refinement).
# - resolution-dependent hyperdiffusion + timestep, interactive land
#   (same b1 confounds); ΔF conflates dynamics with resolution numerics.
# - SpeedyWeather != aeros -> suggestive, not conclusive.
# - ΔF here is the DYNAMICAL-CORE tendency error (dynamics_tendencies!);
#   physics parameterizations respond freely each step and are not part
#   of ΔF, so any residual physics tendency at X85 also limits reproduction.

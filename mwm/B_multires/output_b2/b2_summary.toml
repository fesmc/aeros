[injection_check.pres]
max_baseline  = 0.9202207
max_forced    = 0.0
residual_frac = 0.0

# ------------------------------------------------------------------
# CONSERVATION of ΔF (§3.7 risk 2): global area-weighted mean vs RMS,
# physical per-second units (scaled tendency / radius). A pure
# stationary-wave correction should be ~zero global mean.
# ratio = |global_mean| / RMS (dimensionless, scale-invariant).
# ------------------------------------------------------------------
[conservation.vor]
global_mean_phys_per_s = -0.0
rms_phys_per_s         = 0.0004530954581161149
ratio_mean_over_rms    = 0.0
[conservation.div]
